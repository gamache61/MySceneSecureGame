<body>
<div id="stage"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="letterbox-top"></div>
<div class="letterbox-bottom"></div>
<div id="overlay"><div class="caption" id="caption"></div></div>
<div id="skip">Skip &raquo;</div>
<div id="blackout"></div>

<script>
const stage = document.getElementById('stage');
const caption = document.getElementById('caption');
const blackout = document.getElementById('blackout');
const skip = document.getElementById('skip');

const div = document.createElement('div');
div.className = 'slide';
div.id = 'slide0';
stage.appendChild(div);
const slide = document.getElementById('slide0');

let sequenceDone = false;

function finish() {
  window.location.href = 'TallBuildings.html';
}

function showSlide() {
  void slide.offsetWidth;
  slide.classList.add('active');
  setTimeout(() => {
    caption.textContent = "7 suspects seen escaping from the warehouse and running down the road to the city.";
    caption.classList.add('show');
  }, 500);
}

function endSequence() {
  if (sequenceDone) return;
  sequenceDone = true;
  caption.classList.remove('show');
  setTimeout(() => {
    blackout.classList.add('show');
    setTimeout(finish, 2000);
  }, 600);
}

skip.addEventListener('click', endSequence);

setTimeout(() => {
  blackout.classList.add('hide');
  showSlide();
}, 400);
setTimeout(endSequence, 5400);
</script>
</body>
