  html,body{margin:0;padding:0;overflow:hidden;background:#111;font-family:sans-serif;}
  #crosshair{
    position:fixed;top:50%;left:50%;width:6px;height:6px;
    margin:0;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,0.85);
    pointer-events:none;z-index:10;
  }
  #blocker{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);color:#fff;display:flex;
    align-items:center;justify-content:center;flex-direction:column;

  #blocker h1{margin:0 0 10px;font-size:24px;}
  #blocker p{margin:4px 0;font-size:14px;color:#ccc;}
  #hud{
    position:fixed;bottom:14px;left:14px;color:#fff;font-size:13px;
    background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:4px;z-index:10;
  }

#health-bar{ position:fixed; left:20px; top:50%; transform:translateY(-50%); width:28px; height:320px; background:rgba(0,0,0,0.6); border:2px solid #444; border-radius:14px; overflow:hidden; z-index:20; }

#health-text{ position:fixed; left:62px; top:50%; transform:translateY(-50%) rotate(-90deg); transform-origin:left center; font-family: monospace; font-weight:bold; color:#fff; font-size:18px; letter-spacing:2px; z-index:20; text-shadow:1px 1px 2px #000; }

function buildCharacters(){
  const loader = new THREE.TextureLoader();
  function makeChar(key, pos, type, name){
    const data = CHARACTER_DATA[key];
    const tex = loader.load(data.uri);
    tex.minFilter = THREE.LinearFilter;
    // Fix toothpick: width based on real aspect, height 2.2m
    const height = 2.15;
    const width = height * data.aspect; // 1.15 fudge for padding
    const geo = new THREE.PlaneGeometry(width, height);
    const mat = new THREE.MeshBasicMaterial({map: tex, transparent:true, alphaTest:0.08, side:THREE.DoubleSide, fog:true});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, height/2 - 0.15, pos.z);
    mesh.userData.type = type;
    mesh.userData.name = name;
    mesh.userData.key = key;
    mesh.userData.health = 100;
    mesh.userData.lastShot = 0;
    mesh.userData.width = width;
    mesh.userData.height = height;
    scene.add(mesh);
    characters.push(mesh);
    colliders.push({x:pos.x, z:pos.z, r:0.6, boxHalfX:0.6, boxHalfZ:0.6});
  }
  // Officers - behind you slightly, not blocking
  makeChar('officer', new THREE.Vector3(-2.2, 0, BUILDING_HALF_L + 3), 'officer', 'Officer Davis');
  makeChar('officer', new THREE.Vector3( 2.2, 0, BUILDING_HALF_L + 3), 'officer', 'Officer Chen');
  // Suspects - spread
  makeChar('suspect1', new THREE.Vector3(0, 0, 18), 'suspect', 'Suspect 1');
  makeChar('suspect2', new THREE.Vector3(-5.5, 0, 7), 'suspect', 'Suspect 2');
  makeChar('suspect1', new THREE.Vector3(6, 0, -4), 'suspect', 'Suspect 3');
}

function hasLineOfSight(from, to){
  const dir = new THREE.Vector3().subVectors(to, from);
  const dist = dir.length();
  if(dist < 0.5) return true;
  dir.normalize();
  const steps = Math.ceil(dist / 0.5);
  for(let i=1;i<steps;i++){
    const t = (i/steps)*dist;
    const p = new THREE.Vector3().copy(from).add(dir.clone().multiplyScalar(t));
    for(const c of colliders){
      if(Math.abs(p.x - c.x) < c.boxHalfX + 0.2 && Math.abs(p.z - c.z) < c.boxHalfZ + 0.2){
        if(p.y < 3.5) return false;
      }
    }
  }
  return true;
}

function updateCharacters(){
  if(!controlsYaw || gameOver) return;
  const playerPos = controlsYaw.position;
  const now = performance.now();
  for(const ch of characters){
    if(!ch.parent) continue;
    ch.lookAt(playerPos.x, ch.position.y - 0.15, playerPos.z);
    if(ch.userData.type === 'suspect' && ch.userData.health > 0){
      const dist = ch.position.distanceTo(playerPos);
      if(dist < 20 && now - ch.userData.lastShot > 1300 + Math.random()*1500){
        const eyePos = new THREE.Vector3().copy(ch.position); eyePos.y += 0.8;
        const targetPos = new THREE.Vector3().copy(playerPos); targetPos.y += 1.0;
        if(!hasLineOfSight(eyePos, targetPos)) continue;
        ch.userData.lastShot = now;
        const flash = new THREE.PointLight(0xffcc44, 1.0, 4);
        flash.position.copy(ch.position); flash.position.y += 0.3;
        scene.add(flash); setTimeout(()=>scene.remove(flash), 90);
        if(dist < 17){
          playerHealth -= DAMAGE_PER_SHOT;
          updateHealthUI();
          // camera shake
          if(camera){ camera.position.x += (Math.random()-0.5)*0.1; }
          if(playerHealth <=0){
            endGame(false, 'KILLED IN ACTION');
          }
        }
      }
    }
  }
}

function updateHealthUI(){
  const fill = document.getElementById('health-fill');
  const txt = document.getElementById('health-text');
  if(fill){
    const pct = Math.max(0, Math.min(100, playerHealth));
    fill.style.height = pct + '%';
  }
  if(txt){
    txt.textContent = Math.max(0,Math.floor(playerHealth)) + '%';
    if(playerHealth <= 30) txt.style.color = '#ff4444';
    else if(playerHealth <= 60) txt.style.color = '#ffcc00';
    else txt.style.color = '#fff';
  }
  const bar = document.getElementById('health-bar');
  if(bar){
    if(playerHealth < 30) bar.style.borderColor = '#ff0000';
    else if(playerHealth < 60) bar.style.borderColor = '#ffaa00';
    else bar.style.borderColor = '#666';
  }
}

function restartGame(){
  playerHealth = MAX_HEALTH;
  gameOver = false;
  updateHealthUI();
  for(const ch of characters){ if(ch.parent) scene.remove(ch); }
  characters = [];
  if(typeof buildCharacters === 'function') buildCharacters();
  if(controlsYaw){
    controlsYaw.position.set(0, 1.5, BUILDING_HALF_L + EXT_DEPTH - 1);
    controlsYaw.rotation.y = 0;
  }
  if(typeof controlsPitch !== 'undefined' && controlsPitch) controlsPitch.rotation.x = 0;

function teleportSuspectWarehouse(sus){
  const maxAttempts=60;
  let nx, nz;
  const playerPos=controlsYaw.position;
  let oldColliderIdx=-1;
  for(let i=0;i<colliders.length;i++){ if(Math.abs(colliders[i].x - sus.position.x)<0.01 && Math.abs(colliders[i].z - sus.position.z)<0.01) { oldColliderIdx=i; break; } }
  for(let attempt=0; attempt<maxAttempts; attempt++){
    nx=(Math.random()*2-1)*(BUILDING_HALF_W-2);
    nz=(Math.random()*2-1)*(RACK_Z_LIMIT-1);
    // avoid too close to player
    const d=Math.hypot(nx-playerPos.x, nz-playerPos.z);
    if(d<10) continue;
    // check against colliders (shelves) - simple AABB
    let collides=false;
    for(const c of colliders){
      if(c===colliders[oldColliderIdx]) continue;
      if(Math.abs(nx - c.x) < (c.boxHalfX||0.6)+1.0 && Math.abs(nz - c.z) < (c.boxHalfZ||0.6)+1.0){ collides=true; break; }
    }
    if(collides) continue;
    break;
  }
  if(nx===undefined){ nx=(Math.random()*2-1)*5; nz=(Math.random()*2-1)*5; }
  sus.position.set(nx, sus.position.y, nz);
  if(oldColliderIdx>=0){ colliders[oldColliderIdx].x=nx; colliders[oldColliderIdx].z=nz; }
  /* keep health after hit */
  sus.material.color=new THREE.Color(0x8888ff);
  setTimeout(()=>{ if(sus.material) sus.material.color=new THREE.Color(0xffffff); }, 700);
  try{
    const puff=new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8), new THREE.MeshBasicMaterial({color:0xaaaaaa, transparent:true, opacity:0.6}));
    puff.position.copy(sus.position); puff.position.y+=0.5; scene.add(puff);
    let life=0.6; const anim=()=>{ life-=0.02; puff.scale.multiplyScalar(1.05); puff.material.opacity=life; if(life<=0) scene.remove(puff); else requestAnimationFrame(anim); }; anim();
  }catch(e){}
  const hud=document.getElementById('hud'); if(hud){ const old=hud.textContent; hud.textContent='SUSPECT FLED!'; setTimeout(()=>hud.textContent=old, 1500); }
}

function handleShoot(raycaster){
  if(gameOver) return;
  const intersects = raycaster.intersectObjects(characters);
  if(intersects.length>0){
    const hit = intersects[0].object;
    if(hit.userData.type === 'officer'){
      updateHealthUI();
      endGame(false, 'FRIENDLY FIRE');
      return;
    } else if(hit.userData.type === 'suspect'){
      hit.userData.health -= 34;
      hit.material.color = new THREE.Color(0xff6666);
      setTimeout(()=>{ if(hit.material) hit.material.color = new THREE.Color(0xffffff); }, 120);
      if(hit.userData.health <=0){
        scene.remove(hit);
        if(hit.userData.collider){ const cidx = colliders.indexOf(hit.userData.collider); if(cidx>=0) colliders.splice(cidx,1); }
        const idx = characters.indexOf(hit);
        if(idx>=0) characters.splice(idx,1);
        const remaining = characters.filter(c=>c.userData.type==='suspect').length;
        const hud = document.getElementById('hud');
        if(hud) hud.textContent = `Suspects remaining: ${remaining}`;
        if(remaining===0) endGame(true, 'SECURE');
      } else {
        teleportSuspectWarehouse(hit);
      }
    }
  }
}

function boxTexture(color1, color2){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color1;
  ctx.fillRect(0,0,64,64);
  ctx.strokeStyle = color2;
  ctx.lineWidth = 3;
  ctx.strokeRect(2,2,60,60);
  ctx.beginPath();
  ctx.moveTo(2,32); ctx.lineTo(62,32);
  ctx.moveTo(32,2); ctx.lineTo(32,62);
  ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function buildWalls(){

    [{cx:DOCK1_X, w:DOCK_DOOR_W, h:DOCK_DOOR_H}, {cx:DOCK2_X, w:DOCK_DOOR_W, h:DOCK_DOOR_H}]);

// builds a wall along z=zPos with rectangular openings cut out of it (piers + header),
// and registers colliders for the solid segments only
function buildOpenedWall(zPos, wallMat, wallHeight, openings){
  openings = openings.slice().sort((a,b)=>a.cx-b.cx);
  const wallThick = 0.4;
  let cursor = -BUILDING_HALF_W;
  const maxOpeningH = Math.max(...openings.map(o=>o.h));

  function addPier(x0, x1){
    const w = x1 - x0;
    if(w <= 0.05) return;
    const cx = (x0+x1)/2;
    const pier = new THREE.Mesh(new THREE.BoxGeometry(w, wallHeight, wallThick), wallMat);
    pier.position.set(cx, wallHeight/2, zPos);
    scene.add(pier);
    colliders.push({x:cx, z:zPos, r:0, boxHalfX:w/2, boxHalfZ:wallThick});
  }

  openings.forEach(o=>{
    addPier(cursor, o.cx - o.w/2);
    cursor = o.cx + o.w/2;
  });
  addPier(cursor, BUILDING_HALF_W);

  // header spanning above all the openings, from first opening's left edge to last's right edge
  const first = openings[0], last = openings[openings.length-1];
  const headerX0 = first.cx - first.w/2, headerX1 = last.cx + last.w/2;
  const headerH = wallHeight - maxOpeningH;
  if(headerH > 0.05){
    const header = new THREE.Mesh(new THREE.BoxGeometry(headerX1-headerX0, headerH, wallThick), wallMat);
    header.position.set((headerX0+headerX1)/2, maxOpeningH + headerH/2, zPos);
    scene.add(header);
    // no collider for the header — collision is 2D (x/z only), and it sits above
    // the door opening at player height, so a collider here would wrongly block the doorway
  }
}

function rollupDoorTexture(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c7cbce';
  ctx.fillRect(0,0,64,64);
  ctx.strokeStyle = '#8b9094';
  ctx.lineWidth = 3;
  for(let y=4; y<64; y+=8){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(64,y); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

  const canopy = new THREE.Mesh(new THREE.BoxGeometry(ENTRANCE_W+2, 0.15, 2.5), canopyMat);
  canopy.position.set(0, ENTRANCE_H+0.3, BUILDING_HALF_L + 1.2);
  canopy.castShadow = true;
  scene.add(canopy);

  const entranceLight = new THREE.PointLight(0xfff2cc, 0.7, 9);
  entranceLight.position.set(0, ENTRANCE_H+0.5, BUILDING_HALF_L + 1.5);
  scene.add(entranceLight);
}

function buildTruck(dockX){
  const truck = new THREE.Group();
  const trailerMat = new THREE.MeshStandardMaterial({color:0xd8d8d8, roughness:0.6, metalness:0.2});
  const cabMat = new THREE.MeshStandardMaterial({color:0xb02222, roughness:0.5, metalness:0.3});
  const wheelMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.9});
  const glassMat = new THREE.MeshStandardMaterial({color:0x334455, roughness:0.3, metalness:0.4});

  const trailerLen = 9, trailerH = 3.4, trailerW = 2.6;
  const trailer = new THREE.Mesh(new THREE.BoxGeometry(trailerW, trailerH, trailerLen), trailerMat);
  trailer.position.set(0, trailerH/2, -trailerLen/2 - 0.4);
  trailer.castShadow = true;
  truck.add(trailer);

  const cabLen = 2.4, cabH = 2.6;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(trailerW, cabH, cabLen), cabMat);
  cab.position.set(0, cabH/2, -trailerLen - 0.4 - cabLen/2);
  cab.castShadow = true;
  truck.add(cab);

  const windshield = new THREE.Mesh(new THREE.BoxGeometry(trailerW-0.2, 0.9, 0.08), glassMat);
  windshield.position.set(0, cabH-0.4, -trailerLen-0.4-cabLen+0.1);
  truck.add(windshield);

  const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12);
  [[-0.9, -1.6], [0.9, -1.6], [-0.9, -6], [0.9, -6], [-0.9, -trailerLen-1.6], [0.9, -trailerLen-1.6]].forEach(([wx, wz])=>{
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(wx, 0.5, wz);
    truck.add(wheel);
  });

  // trailer backed up snug against the dock door
  truck.position.set(dockX, 0, -BUILDING_HALF_L - 0.5);
  scene.add(truck);
}

function buildRack(x, frameMat, beamMat, boxMat){
  const postGeo = new THREE.BoxGeometry(0.2, SHELF_HEIGHT, 0.2);
  for(let z=-RACK_Z_LIMIT; z<=RACK_Z_LIMIT; z+=4){
    const post = new THREE.Mesh(postGeo, frameMat);
    post.position.set(x, SHELF_HEIGHT/2, z);
    post.castShadow = true;
    scene.add(post);
  }
  colliders.push({x:x, z:0, r:0, boxHalfX:0.6, boxHalfZ:RACK_Z_LIMIT});

  const levels = 4;
  const plateMat = new THREE.MeshStandardMaterial({color:0x3a3a3a, metalness:0.3, roughness:0.7});
  for(let lvl=0; lvl<=levels; lvl++){
    const y = lvl * (SHELF_HEIGHT/levels);

    const plate = new THREE.Mesh(new THREE.BoxGeometry(SHELF_DEPTH, 0.08, RACK_Z_LIMIT*2), plateMat);
    plate.position.set(x, y, 0);
    scene.add(plate);

    const beam = new THREE.Mesh(new THREE.BoxGeometry(SHELF_DEPTH+0.1, 0.12, RACK_Z_LIMIT*2), beamMat);
    beam.position.set(x, y-0.02, 0);
    scene.add(beam);

    const dense = lvl <= 1;
    const skipChance = dense ? 0 : 0.15;
    const zStep = dense ? 0.85 : 3.2;
    for(let z=-RACK_Z_LIMIT+1.5; z<RACK_Z_LIMIT-1.5; z+=zStep){
      if(Math.random() < skipChance) continue;
      const bw = dense ? SHELF_DEPTH - 0.05 : Math.min(0.7 + Math.random()*0.4, SHELF_DEPTH - 0.15);
      const bh = dense ? (SHELF_HEIGHT/levels) - 0.28 : 0.6 + Math.random()*0.5;
      const bd = dense ? zStep - 0.25 : 0.6 + Math.random()*0.4;
      const box = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd), boxMat);
      const maxXOffset = dense ? 0.02 : (SHELF_DEPTH - bw)/2;
      box.position.set(x + (Math.random()-0.5)*maxXOffset*2, y + bh/2 + 0.02, z + (Math.random()-0.5)*(dense ? 0.1 : 1.2));
      box.rotation.y = dense ? 0 : (Math.random()-0.5)*0.2;
      box.castShadow = true;
      scene.add(box);
    }
  }
}

function buildPistol(){
  pistol = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({color:0x1c1c1c, metalness:0.7, roughness:0.35});
  const gripMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.7});

  const slide = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.05,0.24), bodyMat);
  slide.position.set(0,0.03,-0.05);
  pistol.add(slide);

  const barrelHint = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.05,12), bodyMat);
  barrelHint.rotation.x = Math.PI/2;
  barrelHint.position.set(0, 0.03, -0.19);
  pistol.add(barrelHint);

  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.055,0.05,0.14), bodyMat);
  frame.position.set(0,-0.01,0.02);
  pistol.add(frame);

  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.13,0.06), gripMat);
  grip.position.set(0,-0.09,0.06);
  grip.rotation.x = -0.25;
  pistol.add(grip);

  const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.015,0.03,0.015), bodyMat);
  trigger.position.set(0,-0.03,0.0);
  pistol.add(trigger);

  muzzleFlash = new THREE.PointLight(0xffdd66, 0, 3);
  muzzleFlash.position.set(0,0.03,-0.22);
  pistol.add(muzzleFlash);

  const flashGeo = new THREE.SphereGeometry(0.03,8,8);
  const flashMat = new THREE.MeshBasicMaterial({color:0xffee88, transparent:true, opacity:0});
  const flashMesh = new THREE.Mesh(flashGeo, flashMat);
  flashMesh.position.set(0,0.03,-0.23);
  pistol.add(flashMesh);
  pistol.userData.flashMesh = flashMesh;

  pistol.position.set(0.16, -0.16, -0.32);
  pistol.rotation.y = -0.03;
  camera.add(pistol);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onKeyDown(e){
  if(e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if(e.code === 'Space') onFire();
  switch(e.code){
    case 'KeyW': case 'ArrowUp': moveF = true; break;
    case 'KeyS': case 'ArrowDown': moveB = true; break;
    case 'KeyA': moveL = true; break;
    case 'KeyD': moveR = true; break;
    case 'ArrowLeft': turnL = true; break;
    case 'ArrowRight': turnR = true; break;
    case 'ShiftLeft': case 'ShiftRight': running = true; break;
    case 'KeyO': entranceOpen = !entranceOpen; break;
    case 'KeyR': if(gameOver) restartGame(); break;
  }
}
function onKeyUp(e){
  switch(e.code){
    case 'KeyW': case 'ArrowUp': moveF = false; break;
    case 'KeyS': case 'ArrowDown': moveB = false; break;
    case 'KeyA': moveL = false; break;
    case 'KeyD': moveR = false; break;
    case 'ArrowLeft': turnL = false; break;
    case 'ArrowRight': turnR = false; break;
    case 'ShiftLeft': case 'ShiftRight': running = false; break;
  }
}

const PI_2 = Math.PI/2;
function onMouseMove(e){
  const sensitivity = 0.0022;
  controlsYaw.rotation.y -= e.movementX * sensitivity;
  controlsPitch.rotation.x -= e.movementY * sensitivity;
  controlsPitch.rotation.x = Math.max(-PI_2*0.9, Math.min(PI_2*0.9, controlsPitch.rotation.x));
}

function onFire(){
  if(document.pointerLockElement !== document.body) return;
  recoilT = 1;
  muzzleFlash.intensity = 3;
  pistol.userData.flashMesh.material.opacity = 1;

  raycaster.setFromCamera({x:0,y:0}, camera);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const spark = new THREE.Mesh(
    new THREE.SphereGeometry(0.03,6,6),
    new THREE.MeshBasicMaterial({color:0xffaa00})
  );
  const worldPos = new THREE.Vector3();
  camera.getWorldPosition(worldPos);
  spark.position.copy(worldPos).add(dir.clone().multiplyScalar(2));
  scene.add(spark);
  hitFlashes.push({mesh:spark, life:0.15});

  handleShoot(raycaster);
}

function checkCollision(nx, nz){
  for(const c of colliders){
    if(c.boxHalfX !== undefined){
      if(Math.abs(nx - c.x) < c.boxHalfX + 0.35 && Math.abs(nz - c.z) < c.boxHalfZ + 0.35) return true;
    } else {
      const dx = nx - c.x, dz = nz - c.z;
      if(Math.sqrt(dx*dx+dz*dz) < c.r + 0.35) return true;
    }
  }
  if(nx < -BUILDING_HALF_W+0.6 || nx > BUILDING_HALF_W-0.6) return true;
  if(nz < -BUILDING_HALF_L+0.6) return true; // dock doors are closed
  if(nz > BUILDING_HALF_L-0.6){
    const throughEntrance = entranceOpen && Math.abs(nx - ENTRANCE_X) < ENTRANCE_W/2 - 0.35;
    if(!throughEntrance) return true;
    if(nz > BUILDING_HALF_L + EXT_DEPTH - 0.6) return true; // forecourt outer edge
  }
  return false;
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(turnL){ leftRampT = Math.min(ROT_RAMP_TIME, leftRampT + dt); const rotSpeed = ROT_MIN_SPEED + (ROT_MAX_SPEED-ROT_MIN_SPEED)*(leftRampT/ROT_RAMP_TIME); controlsYaw.rotation.y += rotSpeed * dt; } else { leftRampT = 0; }
  if(turnR){ rightRampT = Math.min(ROT_RAMP_TIME, rightRampT + dt); const rotSpeed = ROT_MIN_SPEED + (ROT_MAX_SPEED-ROT_MIN_SPEED)*(rightRampT/ROT_RAMP_TIME); controlsYaw.rotation.y -= rotSpeed * dt; } else { rightRampT = 0; }

  const speed = (running ? 4.2 : 2.2) * dt;
  const forward = new THREE.Vector3(Math.sin(controlsYaw.rotation.y), 0, Math.cos(controlsYaw.rotation.y));
  const right = new THREE.Vector3(forward.z, 0, -forward.x);

  let mx = 0, mz = 0;
  if(moveF){ mx -= forward.x; mz -= forward.z; }
  if(moveB){ mx += forward.x; mz += forward.z; }
  if(moveL){ mx -= right.x; mz -= right.z; }
  if(moveR){ mx += right.x; mz += right.z; }
  const len = Math.hypot(mx,mz);
  if(len > 0){ mx/=len; mz/=len; }

  const nx = controlsYaw.position.x + mx*speed;
  const nz = controlsYaw.position.z + mz*speed;
  if(!checkCollision(nx, controlsYaw.position.z)) controlsYaw.position.x = nx;
  if(!checkCollision(controlsYaw.position.x, nz)) controlsYaw.position.z = nz;

  // subtle walk bob
  if(len > 0){
    const t = performance.now()*0.012*(running?1.6:1);
    controlsYaw.position.y = 1.35 + Math.sin(t)*0.005;
  } else {
    controlsYaw.position.y += (1.35 - controlsYaw.position.y)*0.1;
  }

  // recoil recovery
  if(recoilT > 0){
    recoilT -= dt*6;
    pistol.position.z = -0.32 + Math.max(0,recoilT)*0.05;
    muzzleFlash.intensity = Math.max(0, 3*recoilT);
    pistol.userData.flashMesh.material.opacity = Math.max(0, recoilT);
  } else {
    pistol.position.z = -0.32;
  }

  // entrance door swing
  if(entranceDoor){
    const targetY = entranceOpen ? -1.9 : 0;
    entranceDoor.rotation.y += (targetY - entranceDoor.rotation.y) * Math.min(1, dt*6);
  }

  for(let i=hitFlashes.length-1;i>=0;i--){
    const hf = hitFlashes[i];
    hf.life -= dt;
    hf.mesh.scale.multiplyScalar(1.15);
    hf.mesh.material.opacity = Math.max(0, hf.life/0.15);
    if(hf.life <= 0){ scene.remove(hf.mesh); hitFlashes.splice(i,1); }
  }

  if(typeof updateCharacters==="function") updateCharacters();
  renderer.render(scene, camera);
}
